[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pytest-collect-profile"
version = "0.1.0"
description = "Find what makes pytest collection slow"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pytest>=8.0",
]

[project.entry-points.pytest11]
collect-profile = "pytest_collect_profile.plugin"

[tool.hatch.build.targets.sdist]
only-include = [
  "CONTRIBUTING.md",
  "README.md",
  "src",
  "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_collect_profile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
