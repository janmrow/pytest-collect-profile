name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require the current main commit
        run: |
          tagged_sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          if [ "$tagged_sha" != "$main_sha" ]; then
            echo "::error::Tag commit $tagged_sha is not the current origin/main commit $main_sha"
            exit 1
          fi
      - name: Require the package version tag
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]

          actual = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match package version {expected!r}")
          PY

  lint:
    name: Ruff lint and format
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.6"
      - name: Lint Python
        run: ruff check --output-format=github .
      - name: Check Python formatting
        run: ruff format --check .

  compatibility:
    name: Python ${{ matrix.python }} / pytest ${{ matrix.pytest_label }} / ${{ matrix.os }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            pytest_label: 8.x
            pytest_spec: ">=8.0,<9"
          - os: ubuntu-latest
            python: "3.11"
            pytest_label: 9.x
            pytest_spec: ">=9.0,<10"
          - os: macos-latest
            python: "3.12"
            pytest_label: 8.x
            pytest_spec: ">=8.0,<9"
          - os: windows-latest
            python: "3.13"
            pytest_label: 9.x
            pytest_spec: ">=9.0,<10"
          - os: ubuntu-latest
            python: "3.14"
            pytest_label: 9.x
            pytest_spec: ">=9.0,<10"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and selected pytest line
        run: python -m pip install --editable . "pytest${{ matrix.pytest_spec }}"
      - name: Run test suite
        run: python -m pytest -q

  build:
    name: Build and test distributions
    needs:
      - validate-release
      - lint
      - compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build and validation tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test the installed wheel workflow
        run: python tests/smoke_installed.py dist/*.whl
      - name: Retain distributions for publication
        uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-collect-profile
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
